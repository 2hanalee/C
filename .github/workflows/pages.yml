# 사이트를 GitHub Pages 로 공개한다.
# 자동으로 돌지 않는다. 저장소 Settings > Pages 에서 Source 를 "GitHub Actions" 로 바꾼 뒤,
# Actions 탭에서 이 작업을 골라 "Run workflow" 를 눌러야 공개된다.
name: Publish site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html characters.html world.html timeline.html webtoon.html assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
