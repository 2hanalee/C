<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Alpha Engineers — One line builds everything</title>
<style>
@font-face{font-family:'ID';src:url('fonts/InterDisplay-Black.otf');font-weight:900}
@font-face{font-family:'ID';src:url('fonts/InterDisplay-Bold.otf');font-weight:700}
@font-face{font-family:'ID';src:url('fonts/InterDisplay-Medium.otf');font-weight:500}
html,body{margin:0;background:#0B0B0D;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ---- 00_core.js ---- */
'use strict';
/* =====================================================================
   ALPHA ENGINEERS — "One line builds everything"   (v2 · 30 s · 120 BPM)
   1920x1080. Every pixel is a pure function of time inside window.seek(t):
   no CSS animation, no timers, no state carried between frames.
   ===================================================================== */
const W = 1920, H = 1080, DUR = 30, BPM = 120, BEAT = 60 / BPM;
const bt = n => (n - 1) * BEAT;                 // start time of beat n (1-based): bt(1)=0, bt(9)=4 ...
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

/* ---------- palette: three colours + black and white ---------- */
const C = { k: '#0B0B0D', w: '#F4F2EE', or: '#FF5A1F', bl: '#2E64FF', li: '#C6FF3A' };
const hex3 = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const K3 = hex3(C.k), W3 = hex3(C.w), OR3 = hex3(C.or), BL3 = hex3(C.bl), LI3 = hex3(C.li);

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const D2R = Math.PI / 180, TAU = Math.PI * 2;
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const css = a => 'rgb(' + Math.round(a[0]) + ',' + Math.round(a[1]) + ',' + Math.round(a[2]) + ')';
const as3 = c => typeof c === 'string' ? hex3(c) : c;
const mix = (a, b, t) => css(mix3(as3(a), as3(b), clamp(t)));
const u32 = a => (0xFF000000 | (Math.round(a[2]) << 16) | (Math.round(a[1]) << 8) | Math.round(a[0])) >>> 0;

/* ---------- easing: all pure functions of normalised time ---------- */
const eo = x => { x = clamp(x); return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); };          // expo out
const ei = x => { x = clamp(x); return x <= 0 ? 0 : Math.pow(2, 10 * x - 10); };          // expo in
const eio = x => { x = clamp(x); return x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2; };
const co = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };                         // cubic out
const ci = x => { x = clamp(x); return x * x * x; };                                      // cubic in
const cio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const qi = x => { x = clamp(x); return x * x; };
const lin = x => clamp(x);
// damped spring step response (z < 1). z = 0.9 -> ~0.15 % overshoot: snappy, never bouncy
function spring(dt, w = 20, z = 0.9) {
  if (dt <= 0) return 0;
  const s = Math.sqrt(1 - z * z), wd = w * s;
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z / s) * Math.sin(wd * dt));
}
// critically damped step in normalised time (zero start velocity, soft landing, ~1 at x = 1)
const sp = x => x <= 0 ? 0 : 1 - (1 + 8 * x) * Math.exp(-8 * x);
// sum-of-steps track: keys [[t, value, dur?], ...]; each key eases from the previous value
function trk(keys, t, e = sp, d0 = 0.4) {
  let v = keys[0][1];
  for (let i = 1; i < keys.length; i++) { const k = keys[i]; if (t > k[0]) v += (k[1] - keys[i - 1][1]) * (k[3] || e)((t - k[0]) / (k[2] || d0)); }
  return v;
}

/* ---------- drawing helpers ---------- */
const F = (wt, size) => wt + ' ' + size + 'px ID';
function pathPts(c, pts, close) {
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  if (close) c.closePath();
}
function strokePts(c, pts, w, col, join = 'bevel', cap = 'butt') {
  if (pts.length < 2 || w <= 0.05) return;
  pathPts(c, pts); c.lineWidth = w; c.strokeStyle = col; c.lineJoin = join; c.lineCap = cap; c.miterLimit = 4; c.stroke();
}
function fillPts(c, pts, col) { pathPts(c, pts, true); c.fillStyle = col; c.fill(); }
function line(c, x0, y0, x1, y1, w, col, cap = 'butt') {
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.lineWidth = w; c.strokeStyle = col; c.lineCap = cap; c.stroke();
}
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2))); }
function ptsLen(pts) { const cum = [0]; let L = 0; for (let i = 1; i < pts.length; i++) { L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); cum.push(L); } return { cum, L }; }
function ptAt(pts, m, f) {            // point at fraction f of total length (m = ptsLen(pts))
  const d = clamp(f) * m.L; let i = 1; while (i < pts.length - 1 && m.cum[i] < d) i++;
  const l = m.cum[i] - m.cum[i - 1], u = l > 1e-9 ? (d - m.cum[i - 1]) / l : 0;
  return [lerp(pts[i - 1][0], pts[i][0], u), lerp(pts[i - 1][1], pts[i][1], u)];
}
function trimPts(pts, a, b) {         // sub-polyline between fractions a..b of the arc length
  a = clamp(a); b = clamp(b); if (b <= a) return [];
  const m = ptsLen(pts), da = a * m.L, db = b * m.L, out = [ptAt(pts, m, a)];
  for (let i = 1; i < pts.length - 1; i++) if (m.cum[i] > da + 1e-6 && m.cum[i] < db - 1e-6) out.push(pts[i]);
  out.push(ptAt(pts, m, b)); return out;
}
function resample(pts, n) { const m = ptsLen(pts), out = []; for (let k = 0; k < n; k++) out.push(ptAt(pts, m, k / (n - 1))); return out; }
const lerpPts = (A, B, p) => A.map((a, i) => [lerp(a[0], B[i][0], p), lerp(a[1], B[i][1], p)]);

/* ---------- hinge chains: the line as a rigid linkage ---------- */
// chain = { x, y, s: [[len, angle], ...] }  (screen space, angles in radians, y down)
function chainPts(ch) { const out = [[ch.x, ch.y]]; let x = ch.x, y = ch.y; for (const s of ch.s) { x += Math.cos(s[1]) * s[0]; y += Math.sin(s[1]) * s[0]; out.push([x, y]); } return out; }
function chainOf(pts) { const s = []; for (let i = 1; i < pts.length; i++) s.push([Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]), Math.atan2(pts[i][1] - pts[i - 1][1], pts[i][0] - pts[i - 1][0])]); return { x: pts[0][0], y: pts[0][1], s }; }
function chainLerp(A, B, p, pl) {     // p: angle/anchor progress, pl: optional length progress
  if (pl === undefined) pl = p;
  return { x: lerp(A.x, B.x, p), y: lerp(A.y, B.y, p), s: A.s.map((a, i) => [lerp(a[0], B.s[i][0], pl), lerp(a[1], B.s[i][1], p)]) };
}

/* ---------- scratch canvases ---------- */
function mkCanvas(w, h, readback) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d', readback ? { willReadFrequently: true } : undefined)]; }
const [scrA, sctxA] = mkCanvas(W, H);

/* ---------- the shared section label (bottom-left, rises out of a mask) ---------- */
const LABEL = { x: 120, y: 990, size: 64 };
function labelParts(a, b) { ctx.font = F(900, LABEL.size); return { wa: ctx.measureText(a).width, wb: ctx.measureText(b).width, cap: ctx.measureText('H').actualBoundingBoxAscent }; }
function drawLabel(t, a, b, colA, colB, tIn, tOut) {
  if (t < tIn - 0.02 || t > tOut + 0.45) return;
  const m = labelParts(a, b);
  ctx.save(); ctx.font = F(900, LABEL.size); ctx.textBaseline = 'alphabetic';
  ctx.beginPath(); ctx.rect(0, LABEL.y - m.cap - 22, W, m.cap + 40); ctx.clip();
  const dyA = (1 - eo((t - tIn) / 0.4)) * 96 + ei((t - tOut) / 0.26) * 96;
  const dyB = (1 - eo((t - tIn - 0.08) / 0.4)) * 96 + ei((t - tOut - 0.05) / 0.26) * 96;
  ctx.fillStyle = colA; ctx.fillText(a, LABEL.x, LABEL.y + dyA);
  ctx.fillStyle = colB; ctx.fillText(b, LABEL.x + m.wa, LABEL.y + dyB);
  ctx.restore();
}

/* ---------- mouse pointer (classic arrow) ---------- */
const PTR = [[0, 0], [0, 17], [4.1, 13.1], [7, 19.6], [9.7, 18.4], [6.9, 12.1], [12.3, 12.1]];
function drawPointer(c, x, y, s, fill = C.k, edge = C.w, press = 0) {
  c.save(); c.translate(x, y); c.scale(s * (1 - 0.12 * press), s * (1 - 0.12 * press));
  pathPts(c, PTR, true); c.lineJoin = 'round'; c.lineWidth = 3.2; c.strokeStyle = edge; c.stroke(); c.fillStyle = fill; c.fill();
  c.restore();
}

/* ---- 10_type.js ---- */
/* =====================================================================
   The Alpha mark, the lockup, and the hook / end-title scenes
   ===================================================================== */
const TYPE = (() => {
  let L, ABIG, ALOCK, AEND, AL, SKC, GR, SKP;
  const LINE0 = { x: 660, y: 540, s: [[100, 0], [200, 0], [300, 0], [0, Math.PI], [0, Math.PI]] }, LINE_W = 16;
  const END_CY = 474;
  const [pcv, pctx] = mkCanvas(W, H, true);

  /* The "A" as one stroke: left foot -> apex -> right foot -> back up -> crossbar.
     Drawn with bevel joins and clipped at the baseline, so it is also a clean linkage. */
  function aGeom(cx, base, capH, hw, w) {
    let al = Math.atan(hw / capH);
    for (let i = 0; i < 5; i++) al = Math.atan((hw - (w / 2) / Math.cos(al)) / (capH - (w / 2) * Math.sin(al)));
    const fx = hw - (w / 2) / Math.cos(al), ay = base - capH + (w / 2) * Math.sin(al), ext = w * 0.9;
    const sa = Math.sin(al), ca = Math.cos(al);
    const P0 = [cx - fx - sa * ext, base + ca * ext], AP = [cx, ay], P2 = [cx + fx + sa * ext, base + ca * ext];
    const yc = base - 0.30 * capH, cbx = fx * (yc - ay) / (base - ay), CR = [cx + cbx, yc], CL = [cx - cbx, yc];
    const SPL = [lerp(P0[0], AP[0], 1 / 3), lerp(P0[1], AP[1], 1 / 3)];
    const aL = Math.atan2(AP[1] - P0[1], AP[0] - P0[0]), aR = Math.atan2(P2[1] - AP[1], P2[0] - AP[0]);
    const d = (p, q) => Math.hypot(q[0] - p[0], q[1] - p[1]);
    const chain = { x: P0[0], y: P0[1], s: [[d(P0, SPL), aL], [d(SPL, AP), aL], [d(AP, P2), aR], [d(P2, CR), aR + Math.PI], [d(CR, CL), Math.PI]] };
    // explicit outline polygon (for the blueprint style)
    const top = base - capH, iay = ay + (w / 2) / sa, xin = y => (y - iay) * Math.tan(al);
    const outer = [[cx - hw, base], [cx - (w / 2) * ca, top], [cx + (w / 2) * ca, top], [cx + hw, base], [cx + xin(base), base], [cx + xin(yc + w / 2), yc + w / 2], [cx - xin(yc + w / 2), yc + w / 2], [cx - xin(base), base]];
    const hole = iay < yc - w / 2 - 1 ? [[cx, iay], [cx + xin(yc - w / 2), yc - w / 2], [cx - xin(yc - w / 2), yc - w / 2]] : null;
    return { chain, base, w, outer, hole, cx, capH, hw, AP, CR, CL, top };
  }
  function drawA(c, ch, w, col, clipY) {
    c.save(); c.beginPath(); c.rect(-4000, -4000, 8000 + W, 4000 + clipY); c.clip();
    strokePts(c, chainPts(ch), w, col, 'bevel', 'butt'); c.restore();
  }

  function init() {
    const S = 250, S2 = 92;
    ctx.font = F(900, S);
    const capH = ctx.measureText('H').actualBoundingBoxAscent, stem = S * 0.168, hw = capH * 0.52, gap = S * 0.028;
    const mL = ctx.measureText('L'), mAll = ctx.measureText('LPHA');
    const lb = -mL.actualBoundingBoxLeft, rb = mAll.actualBoundingBoxRight;
    const TW = 2 * hw + gap + (rb - lb), x0 = -TW / 2, lpx = x0 + 2 * hw + gap - lb;
    const ladv = [...'LPHA'].map((_, i) => ctx.measureText('LPHA'.slice(0, i)).width);
    ctx.font = F(700, S2);
    const capH2 = ctx.measureText('H').actualBoundingBoxAscent, E = [...'ENGINEERS'];
    const adv = E.map(ch => ctx.measureText(ch).width), sum = adv.reduce((a, b) => a + b, 0);
    const elb = -ctx.measureText('E').actualBoundingBoxLeft, erb = adv[8] - ctx.measureText('S').actualBoundingBoxRight;
    const trFull = (TW - (sum - elb - erb)) / 8, trTight = S2 * 0.03;
    const ex = tr => { const o = []; let x = x0 - elb; for (let i = 0; i < 9; i++) { o.push(x); x += adv[i] + tr; } return o; };
    const lg = 46, total = capH + lg + capH2, base1 = -total / 2 + capH, base2 = total / 2;
    ctx.font = F(700, 66);
    const words = [['Build.', C.or], ['Code.', C.bl], ['Play.', C.li]], sp2 = 30;
    const ww = words.map(w => ctx.measureText(w[0]).width), tot = ww.reduce((a, b) => a + b, 0) + sp2 * 2;
    const tagx = []; let tx = -tot / 2; for (let i = 0; i < 3; i++) { tagx.push(tx); tx += ww[i] + sp2; }
    L = { S, S2, capH, capH2, stem, hw, gap, TW, x0, lpx, ladv, exFull: ex(trFull), exTight: ex(trTight), base1, base2, total, words, tagx, tagBase: base2 + 124, E };
    AL = aGeom(x0 + hw, base1, capH, hw, stem);                                   // lockup-local A
    ALOCK = aGeom(960 + x0 + hw, 540 + base1, capH, hw, stem);                    // screen A, hook lockup
    AEND = aGeom(960 + x0 + hw, END_CY + base1, capH, hw, stem);                  // screen A, end title
    ABIG = aGeom(960, 772, 464, 464 * 0.52, stem * 464 / capH);                   // the big opening A
    // the arm skeleton the A unfolds into (blueprint camera, rest pose) and the ground line
    SKP = HW.skel2D(0, 4.0); SKC = chainOf(SKP);
    const cam = HW.camAt(4.0); GR = HW.GROUND.map(P => HW.proj(P, cam));
  }

  /* lockup text in lockup-local coordinates. k: { lp[4], lpDy[4], en[9] (dy), track, mode } */
  function lockupText(c, fg, k) {
    c.textBaseline = 'alphabetic';
    const stroke = k.mode === 'stroke';
    if (stroke) { c.strokeStyle = fg; c.lineWidth = 4; c.lineJoin = 'miter'; c.miterLimit = 3; } else c.fillStyle = fg;
    const put = (s, x, y) => stroke ? c.strokeText(s, x, y) : c.fillText(s, x, y);
    c.font = F(900, L.S);
    const clipX = L.x0 + 2 * L.hw + L.gap * 0.1;
    c.save(); c.beginPath(); c.rect(clipX, -2000, 4000, 2000 + L.base1 + 6); c.clip();
    // the word slides out from behind the A's right leg as one piece; a small per-letter lag opens the spacing
    const wordW = L.ladv[3] + 190, sl = k.lp === undefined ? 1 : k.lp;
    for (let i = 0; i < 4; i++) {
      const x = L.lpx + L.ladv[i], lag = k.lpLag ? k.lpLag * i * 26 : 0;
      put('LPHA'[i], x - (1 - sl) * (wordW + 40) - lag, L.base1 + (k.lpDy ? k.lpDy[i] : 0));
    }
    c.restore();
    c.font = F(700, L.S2);
    c.save(); c.beginPath(); c.rect(-2000, L.base1 + 14, 4000, L.base2 - L.base1 - 8); c.clip();
    const tp = k.track === undefined ? 1 : k.track;
    for (let i = 0; i < 9; i++) put(L.E[i], lerp(L.exTight[i], L.exFull[i], tp), L.base2 + (k.en ? k.en[i] : 0));
    c.restore();
  }
  function aOutline(c, G, lw, col) {
    c.strokeStyle = col; c.lineWidth = lw; c.lineJoin = 'miter'; c.miterLimit = 6;
    pathPts(c, G.outer, true); c.stroke();
    if (G.hole) { pathPts(c, G.hole, true); c.stroke(); }
  }
  const SETTLED = {};
  // full static lockup, lockup-local coords, in a given style
  function lockupStatic(c, fg, mode) {
    if (mode === 'stroke') aOutline(c, AL, 4, fg); else drawA(c, AL.chain, AL.w, fg, AL.base);
    lockupText(c, fg, { mode });
  }

  /* ---------- HOOK (beats 1-8) ---------- */
  function heroHook(t) {
    if (t < 0.5) {            // the line folds at its middle into the A; the crossbar draws last
      const p = spring(t - 0.012, 17, 0.88), pc = eo(seg(t, 0.27, 0.5)), A = ABIG.chain;
      const s = LINE0.s.map((a, i) => i < 3 ? [lerp(a[0], A.s[i][0], p), lerp(a[1], A.s[i][1], p)] : [A.s[i][0] * pc, i === 3 ? lerp(Math.PI, A.s[3][1], p) : Math.PI]);
      return { ch: { x: lerp(LINE0.x, A.x, p), y: lerp(LINE0.y, A.y, p), s }, w: lerp(LINE_W, ABIG.w, p), clip: ABIG.base };
    }
    const p = spring(t - 0.5, 17, 0.9);
    return { ch: chainLerp(ABIG.chain, ALOCK.chain, p), w: lerp(ABIG.w, ALOCK.w, p), clip: lerp(ABIG.base, ALOCK.base, p) };
  }
  function drawHook(t) {
    const F1 = 2.0, F2 = 2.25, F3 = 2.5, F4 = 2.75, U = 3.0;
    if (t < F1) {                                   // black: line -> A -> lockup
      ctx.fillStyle = C.k; ctx.fillRect(0, 0, W, H);
      const h = heroHook(t);
      // slow push-in keeps the lockup alive
      const z = 1 + 0.03 * seg(t, 0.9, 2.0);
      ctx.save(); ctx.translate(960, 540); ctx.scale(z, z); ctx.translate(-960, -540);
      drawA(ctx, h.ch, h.w, C.w, h.clip);
      if (t > 0.5) {
        ctx.save(); ctx.translate(960, 540);
        lockupText(ctx, C.w, {
          lp: eo((t - 0.56) / 0.42), lpLag: 1 - eo((t - 0.6) / 0.5),
          en: [...Array(9)].map((_, i) => (1 - eo((t - 1.0 - i * 0.022) / 0.32)) * (L.capH2 + 40)),
          track: spring(t - 1.5, 15, 0.9),
        });
        ctx.restore();
      }
      ctx.restore();
      return;
    }
    if (t < F4) {                                   // three fields, three materials: blueprint / interface / pixels
      const idx = t < F2 ? 0 : t < F3 ? 1 : 2, t0 = [F1, F2, F3][idx], u = (t - t0) / 0.25;
      const bg = [C.or, C.bl, C.li][idx], fg = [C.k, C.w, C.k][idx];
      const z = [1.03, 1.10, 1.17][idx] + 0.025 * eo(u);
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      if (idx === 2) {                              // snapped to a pixel grid that resolves 30 -> 20 -> 12
        const b = u < 1 / 3 ? 30 : u < 2 / 3 ? 20 : 12, lw = Math.ceil(W / b), lh = Math.ceil(H / b);
        pctx.setTransform(1, 0, 0, 1, 0, 0); pctx.clearRect(0, 0, lw + 2, lh + 2);
        pctx.setTransform(z / b, 0, 0, z / b, 960 / b, 540 / b);
        lockupStatic(pctx, C.k, 'fill');
        pctx.setTransform(1, 0, 0, 1, 0, 0);
        const im = pctx.getImageData(0, 0, lw, lh), d = im.data;
        for (let i = 3; i < d.length; i += 4) d[i] = d[i] >= 118 ? 255 : 0;
        pctx.putImageData(im, 0, 0);
        ctx.imageSmoothingEnabled = false; ctx.drawImage(pcv, 0, 0, lw, lh, 0, 0, lw * b, lh * b); ctx.imageSmoothingEnabled = true;
        return;
      }
      ctx.save(); ctx.translate(960, 540); ctx.scale(z, z);
      if (idx === 0) {                              // blueprint: outlines + construction lines
        const a = eo(u / 0.7), X0 = L.x0, X1 = -L.x0, gx = 150;
        ctx.strokeStyle = C.k; ctx.lineWidth = 2;
        [[-L.total / 2, 1], [L.base1, 0], [L.base2, 0]].forEach(([y, dash], i) => {
          ctx.setLineDash(dash ? [14, 10] : []); const e = eo((u - i * 0.08) / 0.6);
          ctx.beginPath(); ctx.moveTo(X0 - gx * e, y); ctx.lineTo(X0 + (X1 - X0 + gx) * e, y); ctx.stroke();
        });
        ctx.setLineDash([22, 8, 4, 8]); ctx.beginPath(); ctx.moveTo(AL.cx, -L.total / 2 - 90 * a); ctx.lineTo(AL.cx, L.base1 + 60 * a); ctx.stroke(); ctx.setLineDash([]);
        [AL.AP, AL.CR, AL.CL].forEach(P => { ctx.beginPath(); ctx.arc(P[0], P[1], 11 * a, 0, TAU); ctx.stroke(); });
        // dimension line under the lockup
        const dy = L.base2 + 62; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(lerp(0, X0, a), dy); ctx.lineTo(lerp(0, X1, a), dy); ctx.moveTo(X0, dy - 16 * a); ctx.lineTo(X0, dy + 16 * a); ctx.moveTo(X1, dy - 16 * a); ctx.lineTo(X1, dy + 16 * a); ctx.stroke();
        lockupStatic(ctx, C.k, 'stroke');
      } else {                                      // interface: selection box, handles, pointer dragging a corner
        lockupStatic(ctx, C.w, 'fill');
        const m = 38, x = L.x0 - m, y = -L.total / 2 - m, w = L.TW + 2 * m, h = L.total + 2 * m;
        ctx.strokeStyle = C.w; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);

    o.connect(env(t, (big ? 0.85 : 0.5) * a, 0.002, big ? 1.0 : 0.5)).connect(fx);
    const n = noise(t, 0.8), lp = filt('lowpass', 8000, 0.8); lp.frequency.setValueAtTime(8000, t); lp.frequency.exponentialRampToValueAtTime(220, t + 0.5);
    send(n.connect(lp).connect(env(t, (big ? 0.5 : 0.28) * a, 0.002, 0.45)), fx, room);
  }
  function servo(t, dur, a = 0.12, p = 0) {
    const o = osc('sawtooth', 75, t, dur + 0.05); o.frequency.exponentialRampToValueAtTime(160, t + dur * 0.55); o.frequency.exponentialRampToValueAtTime(100, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(a, t + 0.03); g.gain.setValueAtTime(a, t + dur - 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(filt('bandpass', 950, 3)).connect(g).connect(pan(p, fx));
  }
  function clampSnd(t, a = 0.12) {
    [950, 1420].forEach(f => osc('square', f, t, 0.08).connect(filt('bandpass', f, 6)).connect(env(t, a, 0.001, 0.06)).connect(fx));
    noise(t, 0.05).connect(filt('highpass', 2000)).connect(env(t, a * 1.5, 0.001, 0.04)).connect(fx);
  }
  function punch8(t, a = 0.14, p = 0) {     // 8-bit hit
    noise(t, 0.12).connect(filt('lowpass', 3000)).connect(env(t, a * 1.6, 0.001, 0.09)).connect(pan(p, fx));
    const o = osc('square', 420, t, 0.14); o.frequency.exponentialRampToValueAtTime(70, t + 0.12); o.connect(env(t, a, 0.001, 0.12)).connect(pan(p, fx));
  }

  /* =============== ARRANGEMENT =============== */
  // kick on every beat (accents on scene changes and on the K.O.)
  for (let b = 0; b < DUR * 2; b++) { const t = b * BEAT; kick(t, [4, 8, 24, 40, 52].includes(b) ? 1.12 : b % 2 ? 0.82 : 0.95); }

  // ---- HOOK (bars 1-2)
  sub(0, ROOT.Am - 12, 2.0, 0.11); pad(0, 'Am', 2.0, 0.035, 700);
  for (let b = 0; b < 4; b++) hat(b * BEAT + 0.25, 0.05);
  whoosh(0.0, 0.4, true, 0.1);                               // the line folds
  click(0.56, 0.1, 0.25); click(0.62, 0.07, 0.3); for (let i = 0; i < 9; i++) click(1.0 + i * 0.022, 0.06, -0.2 + i * 0.05);
  bell(1.5, NOTE(76), 0.05, 0.3);                            // tracking opens
  stabOrange(2.0, 'Am', 0.12); stabBlue(2.25, 'Am', 0.13); stabLime(2.5, 'Am', 0.09);     // three fields, three timbres
  hit(2.75, false, 0.8); sub(2.75, ROOT.Am - 12, 1.25, 0.13);                                  // the big A lands
  for (let i = 0; i < 8; i++) clank(3.0 + i * 0.125, 0.04 + i * 0.006, (i % 2 ? 0.3 : -0.3));  // linkage ratchets open
  whoosh(3.55, 0.45, true, 0.16);                            // ground line swells into the field

  // ---- HARDWARE (bars 3-6): saw bass on off-beats, metal percussion, servos
  for (let bar = 2; bar < 6; bar++) {
    const t0 = bar * 2, ch = BARS[bar];
    pad(t0, ch, 2.0, 0.028, 800);
    for (let i = 0; i < 4; i++) { bassSaw(t0 + i * BEAT + 0.25, ROOT[ch] - 12); hat(t0 + i * BEAT + 0.25, 0.07); }
    [0, 3, 6, 10, 12, 15].forEach((s, k) => clank(t0 + s * 0.125, 0.05 + (k % 2) * 0.02, s % 4 === 0 ? -0.35 : 0.35));
    clap(t0 + 0.5, 0.16); clap(t0 + 1.5, 0.16);
  }
  hit(4.0, false, 0.7);
  for (let i = 0; i < 11; i++) clank(4.0 + i * 0.045, 0.03, -0.2 + i * 0.04);   // parts click into place
  for (let i = 0; i < 6; i++) bell(4.5 + i * 0.07, NOTE(72 + [0, 3, 7, 12, 7, 3][i]), 0.025, 0.2); // blueprint notes
  whoosh(4.95, 0.8, true, 0.12, -0.4, 0.4);                  // camera swings into 3D
  servo(6.0, 0.34); servo(6.5, 0.3, 0.1, 0.2); servo(7.0, 0.32, 0.1, -0.2); clampSnd(7.5); clampSnd(7.75, 0.08); servo(7.72, 0.26, 0.08);
  whoosh(7.85, 0.3, true, 0.14); [0, 1, 2].forEach(i => blip(8.0 + i * 0.06, 330 * Math.pow(2, i * 4 / 12), 0.05, 0.05, (i - 1) * 0.5));   // one arm becomes three
  [8.5, 9.0].forEach(t => [0.125, 0, 0.25].forEach((d, i) => servo(t + d, 0.22, 0.07, (i - 1) * 0.6)));
  for (let i = 0; i < 6; i++) bell(9.5 + i * 0.125, NOTE(88), 0.03, 0.4);   // the caret blinks
  servo(10.05, 0.4, 0.1); clampSnd(10.5, 0.14); servo(11.0, 0.5, 0.09);
  riser(11.0, 12.0, 0.24); whoosh(11.5, 0.5, true, 0.16);

  // ---- SOFTWARE (bars 7-10): clean, 16th hats, plucked bass, bright arpeggios
  hit(12.0, false, 0.75);
  for (let bar = 6; bar < 10; bar++) {
    const t0 = bar * 2, ch = BARS[bar], cn = CH[ch];
    pad(t0, ch, 2.0, 0.024, 1100);
    for (let i = 0; i < 4; i++) bassPluck(t0 + i * BEAT + 0.25, ROOT[ch] - 12, 0.16, 0.24);
    bassPluck(t0 + 1.875, ROOT[ch] - 12 + 7, 0.1, 0.16);
    for (let s = 0; s < 16; s++) hat(t0 + s * 0.125, s % 2 ? 0.045 : 0.03, s % 4 === 2 ? 0.3 : -0.2);
    if (bar >= 7) for (let s = 0; s < 16; s++) pluck(t0 + s * 0.125, cn[[0, 1, 2, 1][s % 4]] + 12 + (s >= 8 ? 12 : 0), 0.04 + (s % 4 === 0 ? 0.015 : 0), (s % 2 ? 0.35 : -0.35));
    clap(t0 + 0.5, 0.13); clap(t0 + 1.5, 0.13);
  }
  { const o = osc('sine', 300, 12.0, 0.35); o.frequency.exponentialRampToValueAtTime(900, 12.3); o.connect(env(12.0, 0.08, 0.02, 0.3)).connect(fx); }   // caret -> pill
  bell(12.22, NOTE(84), 0.06);                               // chip pops
  for (let i = 0; i < 26; i++) click(12.5 + i * 0.034, 0.13 + (i % 3 === 0 ? 0.04 : 0), ((i * 7) % 5 - 2) * 0.12);
  thump(13.5, 0.32); whoosh(13.45, 0.4, true, 0.12);         // enter: the window grows
  [14.0, 14.5, 15.0].forEach((t, i) => { thump(t, 0.26, 220); click(t, 0.12); const n = [7, 5, 9][i]; for (let k = 0; k < n; k++) bell(t + 0.3 + k * 0.0625, NOTE(76 + k * 2), 0.018, (k / n - 0.5)); });
  [15.5, 16.0, 16.5].forEach((t, i) => blip(t, NOTE(79 + i * 2), 0.04, 0.035, (i - 1) * 0.5, 1.25));   // hover
  whoosh(16.9, 0.3, true, 0.1);                              // cards step into a staircase
  for (let k = 0; k < 6; k++) pluck(17.125 + k * 0.125, [69, 72, 76, 79, 81, 84][k], 0.06, (k / 5 - 0.5) * 0.8, 3200);   // the path climbs
  click(18.0, 0.3); click(18.06, 0.18);                      // select
  for (let k = 0; k < 10; k++) chip(18.05 + k * 0.03, [69, 72, 76, 81][k % 4] + 12, 0.03, (k / 9 - 0.5));   // meter turns lime
  whoosh(18.45, 0.35, false, 0.14);                          // everything else drops away
  whoosh(18.95, 0.55, true, 0.2, -0.8, 0.8);                 // the card flips
  { const o = osc('square', 110, 19.5, 0.5); o.frequency.exponentialRampToValueAtTime(880, 19.95); o.connect(filt('lowpass', 3000)).connect(env(19.5, 0.05, 0.05, 0.42)).connect(fx); }   // game screen boots
  for (let k = 0; k < 4; k++) blip(19.5 + k * 0.125, NOTE(69 + k * 3), 0.05, 0.04, 0, 2);

  // ---- GAME (bars 11-14): square bass, chip arpeggios, 8-bit hits
  hit(20.0, false, 0.7);
  for (let bar = 10; bar < 14; bar++) {
    const t0 = bar * 2, ch = BARS[bar], cn = CH[ch];
    for (let s = 0; s < 8; s++) bassSquare(t0 + s * 0.25, ROOT[ch] - 12 + (s % 2 ? 12 : 0), 0.1, 0.1);
    for (let s = 0; s < 16; s++) chip(t0 + s * 0.125, cn[[0, 1, 2, 1, 0, 2, 1, 2][s % 8]] + 24, 0.022 + (s % 4 === 0 ? 0.012 : 0), (s % 2 ? 0.3 : -0.3), 0.07);
    for (let s = 0; s < 8; s++) hat(t0 + s * 0.25 + 0.125, 0.05, 0.2);
    if (bar < 13) { snare(t0 + 0.5, 0.16); snare(t0 + 1.5, 0.16); }
  }
  for (let k = 0; k < 12; k++) blip(20.08 + k * 0.035, NOTE(64 + (k % 6) * 2), 0.035, 0.04, k % 2 ? 0.3 : -0.3, 1.25);   // fighters assemble
  clank(21.06, 0.12, 0.2); blip(21.06, NOTE(88), 0.04, 0.06, 0.2);     // block
  punch8(21.55, 0.15, -0.3); punch8(22.03, 0.13, 0.3); punch8(22.28, 0.13, 0.3); punch8(22.53, 0.17, 0.3);
  whoosh(22.95, 0.2, false, 0.1); punch8(23.05, 0.15, -0.3);            // sweep
  blip(23.5, NOTE(72), 0.12, 0.06, -0.2, 2);                             // kip-up
  riser(24.0, 25.0, 0.2, 260, 5200); blip(24.5, NOTE(64), 0.25, 0.06, 0, 2.5);   // crouch, leap
  hit(25.0, false, 0.9); punch8(25.0, 0.18);                             // mid-air clash (time stops)
  { const o = osc('square', 1760, 25.0, 0.25); o.frequency.exponentialRampToValueAtTime(880, 25.25); o.connect(env(25.0, 0.03, 0.002, 0.23)).connect(fx); }
  riser(25.25, 26.0, 0.26, 400, 8000);
  for (let i = 0; i < 12; i++) snare(25.25 + i * 0.0625, 0.05 + i * 0.022);   // snare roll into the K.O.
  whoosh(25.45, 0.5, true, 0.16);                                        // dash
  // K.O. — the strongest moment
  hit(26.0, true, 1.1); punch8(26.0, 0.22);
  { const o = osc('square', 1100, 26.0, 0.55); o.frequency.exponentialRampToValueAtTime(90, 26.5); o.connect(env(26.0, 0.1, 0.002, 0.5)).connect(fx); }
  sub(26.0, ROOT.Am - 12, 1.5, 0.16);
  [26.5, 27.0].forEach((t, i) => { thump(t, 0.4, 200); stabLime(t, 'Am', 0.08); blip(t, NOTE(i ? 76 : 72), 0.12, 0.08); });
  for (let k = 0; k < 6; k++) blip(27.18 + k * 0.03, 440 * Math.pow(2, k / 6), 0.03, 0.04);   // bars refill
  whoosh(27.35, 0.35, false, 0.16);                                      // into one line

  // ---- END TITLE (bar 15): the line folds into the A, the chord rings, the words land in the team timbres
  { const o = osc('sine', 220, 27.75, 0.4); o.frequency.exponentialRampToValueAtTime(660, 28.0); o.connect(env(27.75, 0.06, 0.02, 0.35)).connect(fx); }
  hit(28.0, false, 0.6); sub(28.0, ROOT.Am - 12, 1.6, 0.11);
  ['Am'].forEach(ch => CH[ch].concat([71]).forEach((n, i) => {
    const o = osc('sawtooth', NOTE(n), 28.0, 2.0), lp = filt('lowpass', 2400, 1), g = ac.createGain();
    lp.frequency.setValueAtTime(3000, 28.0); lp.frequency.exponentialRampToValueAtTime(500, 29.9);
    g.gain.setValueAtTime(0.0001, 28.0); g.gain.exponentialRampToValueAtTime(0.045, 28.02); g.gain.setValueAtTime(0.045, 29.4); g.gain.exponentialRampToValueAtTime(0.0001, 29.95);
    send(o.connect(lp).connect(g), pan([-0.35, 0.35, -0.15, 0.15][i]), room);
  }));
  for (let i = 0; i < 4; i++) click(27.95 + i * 0.03, 0.07, 0.2);
  stabOrange(28.25, 'Am', 0.08); stabBlue(28.5, 'Am', 0.09); stabLime(28.75, 'Am', 0.06);   // Build. Code. Play.
  for (let b = 56; b < 60; b++) hat(b * BEAT + 0.25, 0.05);
  whoosh(29.5, 0.45, false, 0.12); click(29.62, 0.12);

  const buf = await ac.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  let peak = 0; for (let i = 0; i < N; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  const g = fixedGain || 0.89 / (peak || 1);
  const ab = new ArrayBuffer(44 + N * 4), dv = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); dv.setUint32(4, 36 + N * 4, true); ws(8, 'WAVE'); ws(12, 'fmt '); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true); dv.setUint16(22, 2, true); dv.setUint32(24, SR, true); dv.setUint32(28, SR * 4, true);
  dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, 'data'); dv.setUint32(40, N * 4, true);
  for (let i = 0; i < N; i++) {
    dv.setInt16(44 + i * 4, Math.round(clamp(L[i] * g, -1, 1) * 32767), true);
    dv.setInt16(46 + i * 4, Math.round(clamp(R[i] * g, -1, 1) * 32767), true);
  }
  const u8 = new Uint8Array(ab); let bin = '';
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return { wav: btoa(bin), gain: g };
};

/* ---- 90_main.js ---- */
/* =====================================================================
   seek(t): the whole film is this one function of time
   ===================================================================== */
window.DUR = DUR;
window.seek = function (t) {
  t = ((t % DUR) + DUR) % DUR;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingEnabled = true; ctx.textBaseline = 'alphabetic'; ctx.setLineDash([]);
  if (t < bt(9)) TYPE.drawHook(t);
  else if (t < bt(25)) HW.draw(t);
  else if (t < bt(41)) SW.draw(t);
  else if (t < bt(57)) GAME.draw(t);
  else { ctx.fillStyle = C.k; ctx.fillRect(0, 0, W, H); TYPE.drawEnd(t); }
};
window.ready = (async () => {
  await Promise.all([document.fonts.load(F(900, 100)), document.fonts.load(F(700, 100)), document.fonts.load(F(500, 100))]);
  await document.fonts.ready;
  TYPE.init(); SW.init(); GAME.init();
  window.seek(0);
  return true;
})();
