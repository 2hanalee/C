<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>여명 전야</title>

<!-- First-visit gate: decide before first paint so the intro never flashes for returning visitors.
     ?intro=1 / ?t=seconds / ?debug=1 force the intro (and skip writing the flag in debug). -->
<script>
(function () {
  var d = document.documentElement, seen = false, q = location.search;
  try { seen = localStorage.getItem('intro_seen_v1') === '1'; } catch (e) {}
  if (/[?&](intro|t|debug)=/.test(q)) seen = false;
  d.classList.add(seen ? 'intro-off' : 'intro-on');

  // Google Fonts subset: only the glyphs this page actually uses (a full Korean serif is several MB).
  var T = '끝난 게 아니야.잠시 멈춰 있는 거지.' +
          '— 깨우기소리와 함께 · 아무 곳이나 누르세요건너뛰기ESC' +
          '여명 전야세계 · 인물 · 기록빛이 멈춘 도시계약의 불꽃이 꺼진 지 칠 년.' +
          '그래도 도시는, 아직 숨을 쉬고 있다.인트로 다시 보기';
  var s = '', m = {};
  for (var i = 0; i < T.length; i++) { var c = T.charAt(i); if (!m[c]) { m[c] = 1; s += c; } }
  var l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200..900&display=block&text=' + encodeURIComponent(s);
  document.head.appendChild(l);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --bg: #07060a;
  --tungsten: #ffd9a0;
  --warm: #fff1dc;
  --ink: #d9cfc2;
  --fs: clamp(26px, 7.8vw, 72px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--ink); min-height: 100%; }
body {
  font-family: 'Noto Serif KR', 'Nanum Myeongjo', 'AppleMyungjo', 'Batang', serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
.sr-only {
  position: absolute !important; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* ───────────── intro visibility ───────────── */
#intro, #ember { display: none; }
.intro-on #intro, .intro-on #ember { display: block; }
.intro-on body { overflow: hidden; }
.intro-on #main { opacity: 0; }

/* ───────────── intro canvas ───────────── */
#intro {
  position: fixed; inset: 0; z-index: 20;
  background: var(--bg);
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
.grain {
  position: absolute; inset: -60%;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  opacity: .055;
  pointer-events: none;
  animation: grain 1s steps(1) infinite;
}
@keyframes grain {
  0%   { transform: translate(0, 0); }
  10%  { transform: translate(-4%, -6%); }
  20%  { transform: translate(-9%, 3%); }
  30%  { transform: translate(5%, -9%); }
  40%  { transform: translate(-3%, 8%); }
  50%  { transform: translate(-8%, -2%); }
  60%  { transform: translate(9%, 4%); }
  70%  { transform: translate(2%, 7%); }
  80%  { transform: translate(-6%, 9%); }
  90%  { transform: translate(7%, -4%); }
}
.vignette {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 60% at 50% 46%, rgba(20, 14, 28, .35), rgba(7, 6, 10, 0) 60%),
    radial-gradient(ellipse at 50% 48%, rgba(7, 6, 10, 0) 38%, rgba(1, 0, 3, .82) 100%);
}
#stage {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.bloom {
  position: absolute; left: 50%; top: 50%;
  width: min(120vw, 1300px); height: min(75vh, 700px);
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center, rgba(255, 205, 150, .24), rgba(255, 160, 90, .07) 42%, rgba(255, 140, 70, 0) 70%);
  mix-blend-mode: screen;
  opacity: 0;
}
.streak {
  position: absolute; top: -20%; left: 50%;
  width: 26vw; height: 140%; margin-left: -13vw;
  background: linear-gradient(90deg, rgba(255, 226, 180, 0), rgba(255, 226, 180, .07) 40%, rgba(255, 242, 220, .13) 50%, rgba(255, 226, 180, .07) 60%, rgba(255, 226, 180, 0));
  transform: translateX(-70vw) rotate(18deg);
  mix-blend-mode: screen;
  opacity: 0;
}

/* ───────────── typography ───────────── */
.textwrap {
  position: relative;
  font-size: var(--fs);
  line-height: 1.55;
}
.lines { position: relative; }
.line {
  position: relative;
  display: flex;
  width: max-content;
  margin: 0 auto;
  white-space: pre;
}
.line + .line { margin-top: .16em; }
.sp { display: inline-block; width: .32em; }
.g {
  position: relative;
  display: inline-block;
  margin: 0 .03em;
  font-weight: 200;
  text-align: center;
}
.lit { position: relative; display: block; }
.light {
  position: absolute; left: 50%; top: 50%;
  width: 3.2em; height: 3.2em;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 217, 160, .58) 0, rgba(255, 186, 116, .22) 30%, rgba(255, 150, 80, .06) 50%, rgba(255, 150, 80, 0) 68%);
  mix-blend-mode: screen;
  opacity: 0;
  pointer-events: none;
}
.dot .light { width: 1.9em; height: 1.9em; }
.glow {
  position: absolute; inset: 0;
  color: #ffbd78;
  filter: blur(.13em);
  opacity: 0;
}
.core {
  position: relative; display: block;
  color: var(--warm);
  text-shadow: 0 0 1px rgba(255, 236, 210, .5);
  opacity: 0;
}
.ash {
  position: absolute; inset: 0;
  color: #ff7a2e;
  text-shadow: 0 0 .16em rgba(255, 70, 20, .75), 0 0 .5em rgba(200, 40, 10, .35);
  opacity: 0;
}
.bl { display: inline-block; width: 0; height: 0; vertical-align: baseline; }

/* specular sweep: a skewed window that travels while its content counter-travels */
.specwin {
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 1.7em;
  overflow: hidden;
  transform-origin: 0 0;
  opacity: 0;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 38%, #000 62%, transparent);
          mask-image: linear-gradient(90deg, transparent, #000 38%, #000 62%, transparent);
}
.specin {
  position: absolute; left: 0; top: 0;
  display: flex; white-space: pre;
  transform-origin: 0 0;
}
.sg {
  display: inline-block; margin: 0 .03em; text-align: center;
  font-weight: 500;
  color: #fffaf0;
  text-shadow: 0 0 .1em rgba(255, 240, 215, .95), 0 0 .38em rgba(255, 200, 140, .55);
}

/* floor reflection */
.reflect {
  position: absolute; left: 0; right: 0; top: 100%;
  transform: scaleY(-1);
  opacity: .13;
  filter: blur(1.2px);
  -webkit-mask-image: linear-gradient(to top, #000 0, rgba(0, 0, 0, .45) 28%, transparent 58%);
          mask-image: linear-gradient(to top, #000 0, rgba(0, 0, 0, .45) 28%, transparent 58%);
  pointer-events: none;
}

/* ───────────── ember (gate → pre-roll → afterglow → hand-off) ───────────── */
#ember {
  position: fixed; left: 0; top: 0; width: 0; height: 0;
  z-index: 30; pointer-events: none;
  opacity: 0;
}
#ember .halo {
  position: absolute;
  width: calc(var(--fs) * 2.1); height: calc(var(--fs) * 2.1);
  left: calc(var(--fs) * -1.05); top: calc(var(--fs) * -1.05);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 214, 160, .55) 0, rgba(255, 165, 95, .2) 28%, rgba(255, 120, 60, .05) 50%, rgba(255, 120, 60, 0) 68%);
  mix-blend-mode: screen;
}
#ember .spark {
  position: absolute; width: 6px; height: 6px; left: -3px; top: -3px;
  border-radius: 50%;
  background: #fff6e6;
  box-shadow: 0 0 6px 2px rgba(255, 210, 150, .9), 0 0 18px 6px rgba(255, 150, 80, .35);
}
#ember.breathing .halo { animation: breathe 2.6s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { opacity: .55; transform: scale(.82); }
  50%      { opacity: 1;   transform: scale(1.06); }
}

/* ───────────── gate + controls ───────────── */
#gate {
  position: absolute; inset: 0;
  background: none; border: 0; color: inherit; font: inherit;
  cursor: pointer;
  opacity: 0; pointer-events: none;
  -webkit-tap-highlight-color: transparent;
}
#gate.ready { pointer-events: auto; }
#gate:focus { outline: none; }
.gate-label, .gate-hint {
  position: absolute; left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
}
.gate-label {
  top: calc(50% + var(--fs) * 2.15);
  font-size: 15px; letter-spacing: .42em; padding-left: .42em;
  color: rgba(255, 217, 160, .78);
}
.gate-hint {
  top: calc(50% + var(--fs) * 2.15 + 34px);
  font-size: 11px; letter-spacing: .24em; padding-left: .24em;
  color: rgba(217, 207, 194, .32);
}
#gate:focus-visible .gate-label { outline: 1px solid rgba(255, 217, 160, .45); outline-offset: 8px; }

#skip {
  position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
  z-index: 2;
  background: none; border: 0;
  font: inherit; font-size: 12px; letter-spacing: .22em;
  color: rgba(217, 207, 194, .42);
  padding: 10px 6px; cursor: pointer;
  transition: color .2s;
}
#skip:hover, #skip:focus-visible { color: rgba(255, 217, 160, .9); outline: none; }
#skip kbd {
  font: inherit; font-size: 10px; letter-spacing: .1em;
  border: 1px solid currentColor; border-radius: 3px; padding: 1px 4px; margin-left: 6px; opacity: .7;
}

#debug {
  position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
  z-index: 50;
  display: flex; align-items: center; gap: 10px;
  width: min(560px, calc(100vw - 32px));
  padding: 8px 12px;
  background: rgba(20, 17, 24, .88); border: 1px solid rgba(255, 217, 160, .18); border-radius: 8px;
  font: 12px/1 ui-monospace, Menlo, Consolas, monospace; color: #e8dccb;
}
#debug[hidden] { display: none; }
#debug button { background: none; border: 1px solid rgba(255, 217, 160, .3); color: inherit; border-radius: 4px; width: 30px; height: 24px; cursor: pointer; }
#debug input { flex: 1; accent-color: #ffd9a0; }
#debug output { width: 52px; text-align: right; }

/* ───────────── main page (placeholder content) ───────────── */
#main { position: relative; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
#main::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 30% 0%, rgba(60, 36, 70, .22), rgba(7, 6, 10, 0) 55%),
              radial-gradient(ellipse at 50% 120%, rgba(255, 170, 100, .06), rgba(7, 6, 10, 0) 60%);
}
.mglow {
  position: fixed; left: 0; top: 0;
  width: 560px; height: 560px; margin: -280px 0 0 -280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 190, 120, .09), rgba(255, 190, 120, 0) 65%);
  pointer-events: none;
  transform: translate(50vw, 40vh);
}
.mhead {
  position: relative;
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  padding: 28px clamp(16px, 5vw, 56px);
}
.logo {
  display: inline-flex; align-items: center; gap: 12px;
  color: #efe4d4; text-decoration: none;
  font-weight: 600; font-size: 15px; letter-spacing: .2em;
}
.logo-ember {
  width: 6px; height: 6px; border-radius: 50%;
  background: #fff3df;
  box-shadow: 0 0 6px 2px rgba(255, 210, 150, .9), 0 0 22px 8px rgba(255, 140, 70, .3);
  animation: ember-idle 3.2s ease-in-out infinite;
}
.intro-on .logo-ember { opacity: 0; animation: none; }
@keyframes ember-idle { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
.mhead nav { font-size: 13px; letter-spacing: .3em; color: rgba(217, 207, 194, .5); }
.hero {
  position: relative; flex: 1;
  display: flex; flex-direction: column; justify-content: center;
  padding: 40px clamp(16px, 8vw, 120px);
}
.kicker { font-size: 12px; letter-spacing: .5em; color: #c9a27a; margin-bottom: 22px; }
.hero h1 {
  font-size: clamp(40px, 8vw, 96px); font-weight: 300; line-height: 1.15; letter-spacing: .04em;
  color: #f3e9da;
}
.lede { margin-top: 28px; max-width: 34em; font-size: clamp(15px, 1.6vw, 19px); line-height: 1.95; font-weight: 300; color: rgba(217, 207, 194, .74); }
.mfoot { position: relative; padding: 28px clamp(16px, 5vw, 56px); }
#replay {
  background: none; border: 1px solid rgba(255, 217, 160, .24);
  color: rgba(255, 217, 160, .75);
  font: inherit; font-size: 12px; letter-spacing: .25em;
  padding: 10px 16px; cursor: pointer;
  transition: border-color .2s, color .2s;
}
#replay:hover, #replay:focus-visible { border-color: rgba(255, 217, 160, .6); color: #ffe3b8; outline: none; }

@media (prefers-reduced-motion: reduce) {
  .grain { animation: none; }
  #ember.breathing .halo, .logo-ember { animation: none; }
}
</style>
</head>
<body>

<div id="intro" aria-label="인트로">
  <div class="grain" aria-hidden="true"></div>
  <div id="stage" aria-hidden="true">
    <div class="bloom"></div>
    <div class="streak"></div>
    <div class="textwrap">
      <div class="lines" id="lines"></div>
      <div class="lines reflect" id="reflect"></div>
    </div>
  </div>
  <div class="vignette" aria-hidden="true"></div>
  <p class="sr-only">끝난 게 아니야. 잠시 멈춰 있는 거지.</p>
  <button id="gate" type="button" aria-label="깨우기 — 인트로를 소리와 함께 시작합니다">
    <span class="gate-label" aria-hidden="true">— 깨우기</span>
    <span class="gate-hint" aria-hidden="true">소리와 함께 · 아무 곳이나 누르세요</span>
  </button>
  <button id="skip" type="button">건너뛰기<kbd>ESC</kbd></button>
</div>

<div id="ember" class="breathing" aria-hidden="true"><span class="halo"></span><span class="spark"></span></div>

<div id="debug" hidden>
  <button id="dbgPlay" type="button" aria-label="재생/일시정지">▶</button>
  <input id="dbgRange" type="range" min="0" max="7" step="0.01" value="0" aria-label="타임라인">
  <output id="dbgTime">0.00s</output>
</div>

<!-- Main site — placeholder content to be replaced by the real worldbuilding page. -->
<div id="main">
  <div class="mglow" aria-hidden="true"></div>
  <header class="mhead">
    <a class="logo" href="./">여명 전야<span class="logo-ember" aria-hidden="true"></span></a>
    <nav aria-label="주 메뉴">세계 · 인물 · 기록</nav>
  </header>
  <main class="hero">
    <p class="kicker">세계</p>
    <h1>빛이 멈춘 도시</h1>
    <p class="lede">계약의 불꽃이 꺼진 지 칠 년.<br>그래도 도시는, 아직 숨을 쉬고 있다.</p>
  </main>
  <footer class="mfoot"><button id="replay" type="button">인트로 다시 보기</button></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(function () {
  'use strict';

  var D = document, H = D.documentElement, W = window;
  var KEY = 'intro_seen_v1';
  var params = new URLSearchParams(location.search);
  var main = D.getElementById('main');
  var reduced = W.matchMedia && W.matchMedia('(prefers-reduced-motion: reduce)').matches;

  D.getElementById('replay').addEventListener('click', function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    location.href = location.pathname + '?intro=1';
  });

  if (!H.classList.contains('intro-on')) { initMain(); return; }

  /* ═══════════════════════ setup ═══════════════════════ */
  var intro = D.getElementById('intro');
  var stage = D.getElementById('stage');
  var emberEl = D.getElementById('ember');
  var gate = D.getElementById('gate');
  var skipBtn = D.getElementById('skip');
  var linesEl = D.getElementById('lines');
  var reflEl = D.getElementById('reflect');
  var bloom = D.querySelector('.bloom');
  var streak = D.querySelector('.streak');
  var textwrap = D.querySelector('.textwrap');
  var logoEmber = D.querySelector('.logo-ember');
  var dbg = D.getElementById('debug');
  var dbgRange = D.getElementById('dbgRange');
  var dbgTime = D.getElementById('dbgTime');
  var dbgPlay = D.getElementById('dbgPlay');

  var tParam = params.get('t');
  var seekTo = tParam !== null && isFinite(parseFloat(tParam)) ? Math.max(0, Math.min(7, parseFloat(tParam))) : null;
  var debug = params.has('debug') || seekTo !== null;

  var tl = null, snd = null, started = false, done = false, gateReady = false;

  main.inert = true; main.setAttribute('inert', '');

  // Line configs. Times in seconds; the eojeol rhythm comes from per-glyph + between-word gaps.
  var LINES = [
    { text: '끝난 게 아니야.',     start: 0.50, per: 0.11, gap: 0.18, dotPause: 0,    peak: 1.0, emL: 0.15, emC: 0.68, holdL: 0.26, ign: 0.34, base: 440 },
    { text: '잠시 멈춰 있는 거지.', start: 2.30, per: 0.12, gap: 0.12, dotPause: 0.06, peak: 0.8, emL: 0.10, emC: 0.58, holdL: 0.20, ign: 0.42, base: 220 }
  ];
  var SWEEP = 3.70, SWEEP_DUR = 0.62, SWEEP_STAGGER = 0.12;

  function mk(tag, cls, text) {
    var e = D.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function buildInto(container) {
    return LINES.map(function (L, li) {
      var line = mk('div', 'line l' + (li + 1));
      var win = mk('span', 'specwin'), inn = mk('span', 'specin');
      win.appendChild(inn);
      var items = [];
      Array.from(L.text).forEach(function (ch) {
        if (ch === ' ') { line.appendChild(mk('span', 'sp')); inn.appendChild(mk('span', 'sp')); return; }
        var dot = ch === '.';
        var g = mk('span', 'g' + (dot ? ' dot' : ''));
        var lit = mk('span', 'lit');
        var light = mk('span', 'light');
        var glow = mk('span', 'glow', ch);
        var core = mk('span', 'core', ch);
        var bl = mk('i', 'bl');
        core.appendChild(bl);
        var ash = mk('span', 'ash', ch);
        lit.appendChild(light); lit.appendChild(glow); lit.appendChild(core);
        g.appendChild(lit); g.appendChild(ash);
        line.appendChild(g);
        var sg = mk('span', 'sg', ch);
        inn.appendChild(sg);
        items.push({ ch: ch, dot: dot, g: g, lit: lit, light: light, glow: glow, core: core, bl: bl, ash: ash, sg: sg });
      });
      line.appendChild(win);
      container.appendChild(line);
      return { el: line, win: win, inn: inn, items: items };
    });
  }

  var A = buildInto(linesEl), B = buildInto(reflEl);
  var glyphs = [], lines = [];
  A.forEach(function (LA, li) {
    var LB = B[li], L = LINES[li];
    var times = [], t = L.start, first = true, sp = false;
    Array.from(L.text).forEach(function (ch) {
      if (ch === ' ') { sp = true; return; }
      if (!first) t += L.per + (sp ? L.gap : 0) + (ch === '.' ? L.dotPause : 0);
      first = false; sp = false;
      times.push(+t.toFixed(3));
    });
    var lo = { cfg: L, el: LA.el, win: [LA.win, LB.win], inn: [LA.inn, LB.inn], glyphs: [] };
    LA.items.forEach(function (a, k) {
      var b = LB.items[k];
      var G = {
        ch: a.ch, dot: a.dot, line: li, k: k, t: times[k], el: a.g, bl: a.bl,
        g: [a.g, b.g], lit: [a.lit, b.lit], light: [a.light, b.light], glow: [a.glow, b.glow],
        core: [a.core, b.core], ash: [a.ash, b.ash], sg: [a.sg, b.sg]
      };
      glyphs.push(G); lo.glyphs.push(G);
    });
    lines.push(lo);
  });

  function fl(list, key) { return list.reduce(function (acc, G) { return acc.concat(G[key]); }, []); }
  function fsPx() { return parseFloat(getComputedStyle(textwrap).fontSize) || 32; }

  /* ═══════════════════════ measurement ═══════════════════════ */
  var widthsLocked = false;
  var logoPos = { x: 0, y: 0 };
  var cv = D.createElement('canvas').getContext('2d');

  function lockWidths() {
    // Hold every glyph box at its final (500) width so the weight animation never shifts the line.
    var fs = fsPx();
    glyphs.forEach(function (G) { G.el.style.fontWeight = '500'; });
    glyphs.forEach(function (G) { G.wEm = G.el.getBoundingClientRect().width / fs; });
    glyphs.forEach(function (G) {
      G.el.style.fontWeight = '';
      G.g.concat(G.sg).forEach(function (e) { e.style.width = G.wEm.toFixed(4) + 'em'; });
    });
    widthsLocked = true;
  }

  function measure() {
    if (!widthsLocked) lockWidths();
    var fs = fsPx();
    cv.font = '500 ' + fs + 'px "Noto Serif KR", serif';
    lines.forEach(function (L) {
      var r = L.el.getBoundingClientRect();
      L.left = r.left; L.w = r.width;
      L.inn.forEach(function (e) { e.style.width = r.width + 'px'; });
    });
    glyphs.forEach(function (G) {

      var gr = G.el.getBoundingClientRect();

  /* ═══════════════════════ timeline ═══════════════════════ */
  function buildTimeline() {
    var fs = fsPx(), vw = W.innerWidth;
    var T = gsap.timeline({ paused: true, onUpdate: syncDebug, onComplete: function () { if (!debug) finish(); } });
    var allLight = fl(glyphs, 'light'), allLit = fl(glyphs, 'lit');
    var l1 = lines[0].glyphs, l2 = lines[1].glyphs;
    var g0 = glyphs[0], gEnd = glyphs[glyphs.length - 1], gDot1 = l1[l1.length - 1];

      var L = lines[G.line], s0 = SWEEP + G.line * SWEEP_STAGGER;

     .fromTo(emberEl, { opacity: 1, scale: 1 }, { scale: 1.35, duration: 0.22, ease: 'power2.out' }, 0)
     .to(emberEl, { scale: 0.9, duration: 0.2, ease: 'power2.in' }, 0.22)
     .to(emberEl, { opacity: 0, duration: 0.16, ease: 'power1.in' }, 0.44);

    /* 0.50–3.70 glyph ignition — the light head travels, earlier glyphs settle to ember */
    glyphs.forEach(function (G) {
      var L = LINES[G.line], t = G.t;
      T.fromTo(G.light, { opacity: 0, scale: 0.5 }, { opacity: L.peak, scale: 1, duration: 0.08, ease: 'power2.out' }, t)
       .fromTo(G.glow, { opacity: 0 }, { opacity: 0.9 * L.peak, duration: 0.12, ease: 'power1.out' }, t + 0.03)
       .fromTo(G.core, { opacity: 0, filter: 'blur(10px)' }, { opacity: 1, filter: 'blur(0px)', duration: L.ign, ease: 'power3.out' }, t + 0.04)
       .fromTo(G.g, { fontWeight: 200 }, { fontWeight: 500, duration: L.ign + 0.06, ease: 'power2.out' }, t + 0.04)
       .fromTo(G.g, { x: 0, y: 0 }, {
          keyframes: [
            { x: 1.4,  y: -0.9, duration: 0.045 },
            { x: -1.1, y: 0.6,  duration: 0.05 },
            { x: 0.6,  y: -0.4, duration: 0.055 },
            { x: 0,    y: 0,    duration: 0.08 }
          ], ease: 'none' }, t + 0.05);
      decay(G.light, { opacity: L.emL, scale: 0.8, ease: 'power2.out' }, t + 0.14, 0.75, G.limit);
      decay(G.glow, { opacity: 0.3 * L.peak + 0.04, ease: 'power2.out' }, t + 0.22, 0.85, G.limit);
      decay(G.core, { opacity: L.emC, ease: 'sine.inOut' }, t + 0.5, 0.8, G.limit);
    });

    T.to(gDot1.light, { opacity: 0.5, scale: 1.25, duration: 0.18, ease: 'sine.out' }, 1.98)
     .to(gDot1.light, { opacity: LINES[0].emL + 0.05, scale: 0.85, duration: 0.24, ease: 'sine.in' }, 2.16);

    /* 3.70–4.50 diagonal specular sweep → peak + bloom */

       .fromTo(L.inn, { x: -x0, skewX: 18 }, { x: -x1, skewX: 18, duration: SWEEP_DUR, ease: 'power1.inOut' }, s0)
       .fromTo(L.win, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'power1.out' }, s0)
       .to(L.win, { opacity: 0, duration: 0.14, ease: 'power1.in' }, s0 + SWEEP_DUR - 0.14);
    });

      var L = LINES[G.line], ta = G.ta;

       .to(G.glow, { opacity: 1, duration: 0.12, ease: 'power2.out' }, ta - 0.04)
       .to(G.core, { opacity: 1, duration: 0.12, ease: 'power2.out' }, ta - 0.04)
       .to(G.light, { opacity: L.holdL, scale: 0.9, duration: 0.5, ease: 'power2.out' }, ta + 0.14)
       .to(G.glow, { opacity: 0.6, duration: 0.5, ease: 'power2.out' }, ta + 0.14)
       .to(G.core, { opacity: 0.97, duration: 0.5, ease: 'power2.out' }, ta + 0.14);

    T.fromTo(streak, { x: -0.7 * vw, rotation: 18 }, { x: 0.7 * vw, rotation: 18, duration: 0.95, ease: 'power1.inOut' }, 3.62)
     .fromTo(streak, { opacity: 0 }, { opacity: 0.9, duration: 0.3, ease: 'power1.out' }, 3.62)
     .to(streak, { opacity: 0, duration: 0.3, ease: 'power1.in' }, 4.27)
     .fromTo(bloom, { opacity: 0 }, { opacity: 0.34, duration: 0.45, ease: 'power2.out' }, 3.95)
     .to(bloom, { opacity: 0.16, duration: 0.6, ease: 'sine.inOut' }, 4.45);

        { opacity: 0.982, duration: 0.12 }, { opacity: 1, duration: 0.1 },

    /* 5.10–5.80 brownout (≤3 flashes/s: dip → recover → off → weak relight → cut) */
    T.to(allLit, { opacity: 0.6, duration: 0.04, ease: 'power1.in' }, 5.10)
     .to(bloom, { opacity: 0.08, duration: 0.04 }, 5.10)
     .to(allLit, { opacity: 0.92, duration: 0.07, ease: 'power1.out' }, 5.20)
     .to(bloom, { opacity: 0.13, duration: 0.07 }, 5.20)
     .to(allLit, { opacity: 0, duration: 0.025, ease: 'none' }, 5.35)
     .to(bloom, { opacity: 0, duration: 0.025 }, 5.35)
     .to(fl(l2, 'lit'), { opacity: 0.3, duration: 0.03, ease: 'none' }, 5.45)
     .to(fl(l2, 'lit'), { opacity: 0, duration: 0.02, ease: 'none' }, 5.75);

    /* 5.35 / 5.75 → filament afterglow: orange → deep red → black, exponential-ish */
    T.fromTo(fl(l1, 'ash'),
        { opacity: 0.42, filter: 'brightness(1.1) hue-rotate(0deg)' },
        { opacity: 0, filter: 'brightness(0.5) hue-rotate(-16deg)', duration: 1.15, ease: 'power3.out', immediateRender: false }, 5.35)
     .fromTo(fl(l2, 'ash'),
        { opacity: 0.42, filter: 'brightness(1.1) hue-rotate(0deg)' },
        { opacity: 0.3, filter: 'brightness(0.95) hue-rotate(-4deg)', duration: 0.1, ease: 'power2.out', immediateRender: false }, 5.35)
     .fromTo(fl(l2, 'ash'),
        { opacity: 0.5, filter: 'brightness(1.1) hue-rotate(0deg)' },
        { opacity: 0, filter: 'brightness(0.45) hue-rotate(-18deg)', duration: 0.85, ease: 'power3.out', immediateRender: false }, 5.75);

    /* 5.80–6.60 the last period keeps one ember; it pulses once */
    T.fromTo(emberEl, { x: gEnd.cx, y: gEnd.cy }, { x: gEnd.cx, y: gEnd.cy, duration: 0.01, immediateRender: false }, 5.74)
     .fromTo(emberEl, { opacity: 0, scale: 0.45 }, { opacity: 0.6, scale: 0.6, duration: 0.22, ease: 'power2.out', immediateRender: false }, 5.78)
     .to(emberEl, { opacity: 1, scale: 1.1, duration: 0.2, ease: 'power2.out' }, 6.02)
     .to(emberEl, { opacity: 0.5, scale: 0.62, duration: 0.36, ease: 'power2.inOut' }, 6.22);

    T.fromTo(emberEl, { x: gEnd.cx, y: gEnd.cy }, { x: logoPos.x, y: logoPos.y, duration: 0.4, ease: 'power3.inOut', immediateRender: false }, 6.60)
     .to(emberEl, { scale: 0.4, duration: 0.4, ease: 'power2.inOut' }, 6.60)
     .to(intro, { opacity: 0, duration: 0.4, ease: 'power1.inOut' }, 6.60)
     .fromTo(main, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.38, ease: 'power2.out' }, 6.62)
     .fromTo(logoEmber, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: 'none' }, 6.90)
     .to(emberEl, { opacity: 0, duration: 0.1, ease: 'none' }, 6.90);

  }

  function animatedEls() {

      .concat(fl(glyphs, 'g'), fl(glyphs, 'lit'), fl(glyphs, 'light'), fl(glyphs, 'glow'), fl(glyphs, 'core'), fl(glyphs, 'ash'))

  // Rebuild from scratch (clean inline state → re-measure → new timeline at the same time).

    gsap.set(animatedEls(), { clearProps: 'opacity,transform,filter,fontWeight' });
    measure();
    tl = buildTimeline();
    if (started || debug) {
      tl.time(t, true);

  var resizeTimer = 0;
  function onResize() {

      var ng = ctx.createGain();
      ng.gain.setValueAtTime(0.55, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      n.connect(lp); lp.connect(ng); ng.connect(out); n.start(t, 0.3); n.stop(t + 0.08);

      var th = osc('sine', 190), tg = ctx.createGain();
      th.frequency.setValueAtTime(190, t); th.frequency.exponentialRampToValueAtTime(85, t + 0.07);
      tg.gain.setValueAtTime(0.35, t); tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      th.connect(tg); tg.connect(out); th.start(t); th.stop(t + 0.14);

      var sub = osc('sine', 80), sg = ctx.createGain();
      sub.frequency.setValueAtTime(80, t); sub.frequency.exponentialRampToValueAtTime(30, t + 0.38);
      sg.gain.setValueAtTime(0, t); sg.gain.linearRampToValueAtTime(0.6, t + 0.006); sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
      sub.connect(sg); sg.connect(out); sub.start(t); sub.stop(t + 0.8);
    })();

    return {
      stop: function () {
        try {
          var t = ctx.currentTime;
          out.gain.cancelScheduledValues(t);
          out.gain.setValueAtTime(out.gain.value, t);
          out.gain.linearRampToValueAtTime(0, t + 0.25);
        } catch (e) {}
        setTimeout(function () { try { if (ctx.close) ctx.close(); } catch (e) {} }, 400);
      }
    };
  }

  function startSound(audio) {
    audio.ready.catch(function () {}).then(function () {
      if (done || audio.ctx.state !== 'running') return;
      var ctx = audio.ctx, tt = tl ? tl.time() : 0;
      try { snd = buildSound(ctx, ctx.currentTime - tt + 0.01, tt); } catch (e) { snd = null; }
      // close the context once the score (and the clunk's tail) is over → true silence
      setTimeout(function () { if (snd) snd.stop(); }, Math.max(0, (7.4 - tt) * 1000));
    });
  }
  function muteSound() { if (snd) { snd.stop(); snd = null; } }

  /* ═══════════════════════ flow ═══════════════════════ */
  function showGate() {
    gsap.set(emberEl, { x: glyphs[0].cx, y: glyphs[0].cy, scale: 1 });
    gsap.fromTo(emberEl, { opacity: 0 }, { opacity: 1, duration: 1.2, ease: 'power2.out' });
    gsap.fromTo(gate, { opacity: 0 }, { opacity: 1, duration: 1.0, delay: 0.5, ease: 'power1.out' });
    gate.classList.add('ready');
    gateReady = true;
    try { gate.focus({ preventScroll: true }); } catch (e) {}
  }

  function start() {
    if (started || done || !gateReady) return;
    started = true;
    var audio = unlockAudio();              // must run synchronously inside the gesture
    gate.classList.remove('ready');
    gsap.to(gate, { opacity: 0, duration: 0.3, ease: 'power1.out', onComplete: function () { gate.hidden = true; } });
    emberEl.classList.remove('breathing');
    tl.play(0);
    if (audio) startSound(audio);
    try { skipBtn.focus({ preventScroll: true }); } catch (e) {}
  }

  function skip() {
    if (done) return;
    if (tl) tl.pause();
    muteSound();
    if (!W.gsap) { finish(); return; }
    gsap.killTweensOf([intro, main, emberEl]);
    gsap.to([intro, emberEl], { opacity: 0, duration: 0.45, ease: 'power1.inOut' });
    gsap.to(main, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out', onComplete: finish });
  }

  function finish() {
    if (done) return;
    done = true;
    if (!debug) { try { localStorage.setItem(KEY, '1'); } catch (e) {} }
    muteSound();
    if (tl) tl.kill();
    W.removeEventListener('resize', onResize);
    D.removeEventListener('keydown', onKey);
    intro.style.display = 'none';
    emberEl.style.display = 'none';
    main.style.opacity = ''; main.style.transform = '';
    logoEmber.style.opacity = '';
    H.classList.remove('intro-on');
    H.classList.add('intro-off', 'intro-finished');
    main.inert = false; main.removeAttribute('inert');
    initMain();
  }

  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); skip(); return; }
    if (e.shiftKey && (e.key === 'D' || e.key === 'd')) { dbg.hidden = !dbg.hidden; return; }
    if (started || !gateReady) return;
    if (e.key === 'Tab' || e.key === 'Shift' || e.key === 'Alt' || e.key === 'Control' || e.key === 'Meta' ||
        e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target === skipBtn) return;
    e.preventDefault();
    start();
  }

  /* reduced motion: static, fully lit text with a 1s fade — no flicker, no gate, no sound */
  function reducedFlow() {
    gate.hidden = true;
    emberEl.style.display = 'none';
    measure();
    gsap.set(fl(glyphs, 'light'), { xPercent: -50, yPercent: -50, opacity: 0.22, scale: 0.9 });
    gsap.set(fl(glyphs, 'glow'), { opacity: 0.55 });
    gsap.set(fl(glyphs, 'core'), { opacity: 0.97 });
    gsap.set(fl(glyphs, 'g'), { fontWeight: 500 });
    gsap.set(bloom, { opacity: 0.12 });
    gsap.fromTo(stage, { opacity: 0 }, { opacity: 1, duration: 1, ease: 'power1.inOut' });
    gsap.delayedCall(3.6, function () {
      if (done) return;
      gsap.to(intro, { opacity: 0, duration: 1, ease: 'power1.inOut' });
      gsap.to(main, { opacity: 1, duration: 1, ease: 'power1.inOut', onComplete: finish });
    });
  }

  /* debug scrubber (?debug=1, ?t=seconds, or Shift+D) */
  function syncDebug() {
    if (dbg.hidden || !tl) return;
    dbgRange.value = tl.time().toFixed(2);
    dbgTime.textContent = tl.time().toFixed(2) + 's';
    dbgPlay.textContent = tl.paused() ? '▶' : '❚❚';
  }
  function setupDebug() {
    dbg.hidden = !debug;
    dbgRange.addEventListener('input', function () {
      if (!tl) return;
      muteSound();
      if (!started) { started = true; gate.hidden = true; emberEl.classList.remove('breathing'); }
      tl.pause(); tl.seek(parseFloat(dbgRange.value), true);
      syncDebug();
    });
    dbgPlay.addEventListener('click', function () {
      if (!tl) return;
      muteSound();
      if (!started) { started = true; gate.hidden = true; emberEl.classList.remove('breathing'); }
      if (tl.paused()) { if (tl.time() >= tl.duration() - 0.01) tl.time(0); tl.play(); } else tl.pause();
      syncDebug();
    });
  }

  /* ═══════════════════════ boot ═══════════════════════ */
  function fontsReady() {
    var p = (D.fonts && D.fonts.load)
      ? Promise.all([D.fonts.load('200 1em "Noto Serif KR"', '끝난게아니야'), D.fonts.load('500 1em "Noto Serif KR"', '잠시멈춰있는거지.')])
      : Promise.resolve();
    return Promise.race([p, new Promise(function (r) { setTimeout(r, 1500); })]).catch(function () {});
  }

  function ensureGsap(cb) {
    if (W.gsap) return cb(true);
    var s = D.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js';
    s.onload = function () { cb(!!W.gsap); };
    s.onerror = function () { cb(false); };
    D.head.appendChild(s);
  }

  skipBtn.addEventListener('click', skip);
  D.addEventListener('keydown', onKey);

  ensureGsap(function (ok) {
    if (!ok) { finish(); return; }           // no animation engine → just show the site
    gsap.ticker.lagSmoothing(0);             // keep the timeline locked to wall-clock (audio sync)
    fontsReady().then(function () {
      if (done) return;
      if (reduced && !debug) { reducedFlow(); return; }
      setupDebug();
      measure();
      tl = buildTimeline();
      W.addEventListener('resize', onResize);
      gate.addEventListener('pointerdown', function (e) { if (e.button === 0 || e.pointerType !== 'mouse') start(); });
      gate.addEventListener('click', start);
      if (debug) W.__intro = { tl: function () { return tl; }, buildSound: buildSound, glyphs: glyphs };
      if (seekTo !== null) {
        started = true; gate.hidden = true; emberEl.classList.remove('breathing');
        tl.seek(seekTo, true);
        if (params.get('play') === '1') tl.play();
        syncDebug();
      } else {
        showGate();
      }
    });
  });

  /* ═══════════════════════ main page ═══════════════════════ */
  function initMain() {
    var glow = D.querySelector('.mglow');
    if (!glow || reduced || initMain.on) return;
    initMain.on = true;
    var x = W.innerWidth / 2, y = W.innerHeight * 0.4, tx = x, ty = y;
    W.addEventListener('pointermove', function (e) { tx = e.clientX; ty = e.clientY; }, { passive: true });
    (function loop() {
      x += (tx - x) * 0.08; y += (ty - y) * 0.08;
      glow.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
